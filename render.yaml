services:
  - type: web
    runtime: node
    name: derivbot
    repo: https://github.com/asmbizdigital-commits/derivbot
    branch: main
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_VERSION
        value: 22.13.0
      - key: DERIV_APP_ID
        sync: false
      - key: DERIV_OAUTH_CLIENT_ID
        sync: false
      - key: DERIV_OAUTH_REDIRECT_URI
        sync: false
      - key: DERIV_API
        sync: false
      - key: DERIV_OPTIONS_ACCOUNT_ID
        sync: false
      # Existing private MySQL service: copy its connection settings here.
      # The web service and MySQL must share the same region and workspace.
      - key: COPYTRADING_STORAGE
        value: mysql
      - key: COPYTRADING_ADMIN_KEY
        sync: false
      - key: MYSQL_HOST
        sync: false
      - key: MYSQL_PORT
        value: "3306"
      - key: MYSQL_DATABASE
        value: derivbot
      - key: MYSQL_USER
        sync: false
      - key: MYSQL_PASSWORD
        sync: false
      # Render private network. Enable TLS for a MySQL server configured for TLS.
      - key: MYSQL_SSL
        value: "false"
